name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ── eBPF 内核态对象：nightly + build-std + bpf-linker ──────────────────
      - name: Install Rust nightly (for eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install bpf-linker
        run: |
          # 预编译二进制（llvm-sys 源码构建对 runner 太脆弱）。
          # 新版本发布时更新此版本号；资产命名见 aya-rs/bpf-linker releases。
          VER="v0.12.0"
          ASSET="bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          curl -sL "https://github.com/aya-rs/bpf-linker/releases/download/${VER}/${ASSET}" -o /tmp/bpf-linker.tar.zst
          tar --zstd -xf /tmp/bpf-linker.tar.zst
          install -m755 bpf-linker ~/.cargo/bin/bpf-linker
          ~/.cargo/bin/bpf-linker --version

      - name: Build eBPF object
        run: |
          cd uperf-ebpf
          cargo +nightly build --target bpfel-unknown-none -Z build-std=core --release
          mkdir -p ../module/bin
          cp target/bpfel-unknown-none/release/uperf-ebpf ../module/bin/uperf-ebpf

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Configure cargo linker
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          EOF

      - name: Build release binary
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # 必须显式 +stable：上面的 nightly 步骤会把默认工具链切成 nightly，
          # 而 aarch64-linux-android target 只装在 stable 上，不指定会报
          # E0463 can't find crate for `core`。
          cargo +stable build --release --target aarch64-linux-android

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "ver=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "ver=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Package flashable zip
        run: |
          VER="${{ steps.version.outputs.ver }}"
          ZIPNAME="uperf-${VER}.zip"

          cp -r module pkg

          mkdir -p pkg/bin
          cp target/aarch64-linux-android/release/uperf pkg/bin/uperf
          # uperf-ebpf 已在 Build eBPF object 步骤拷入 module/bin/

          mkdir -p pkg/config
          cp config/*.json pkg/config/

          sed -i "s/^version=.*/version=${VER}/" pkg/module.prop
          sed -i "s/^versionCode=.*/versionCode=$(date +%Y%m%d)/" pkg/module.prop

          cd pkg
          zip -r9 "../${ZIPNAME}" . --exclude "*.placeholder"
          # 二进制用 store 模式（安装时不需要解压缩，节省时间）
          zip -r0 "../${ZIPNAME}" bin/uperf bin/uperf-ebpf
          cd ..

          echo "ZIPNAME=${ZIPNAME}" >> $GITHUB_ENV
          ls -lh "${ZIPNAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uperf-zip
          path: ${{ env.ZIPNAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIPNAME }}
          generate_release_notes: true
